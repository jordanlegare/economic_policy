worker_processes auto;
worker_rlimit_nofile 1048576;
pid /run/nginx-cad-policy.pid;
error_log /var/log/nginx/cad-policy-error.log warn;

events {
    use epoll;
    worker_connections 262144;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format cad_capacity '$remote_addr - $request_method $request_uri $status '
                            '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                            'u=$upstream_addr cache=$upstream_cache_status';
    access_log /var/log/nginx/cad-policy-access.log cad_capacity;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 30s;
    keepalive_requests 10000;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    reset_timedout_connection on;
    client_max_body_size 128k;

    proxy_cache_path /var/cache/nginx/cad-policy
                     levels=1:2
                     keys_zone=cad_static:64m
                     max_size=2g
                     inactive=24h
                     use_temp_path=off;

    map $http_x_cad_session_id $cad_affinity {
        ""      $remote_addr;
        default $http_x_cad_session_id;
    }

    # Session-affine backend pool. The application persists negotiation events,
    # so consistent hashing keeps a live session on one process while allowing
    # reconstruction on another process after a backend failure/restart.
    upstream cad_backends {
        zone cad_backends 128k;
        hash $cad_affinity consistent;

        server 127.0.0.1:18080 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18081 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18082 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18083 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18084 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18085 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18086 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18087 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18088 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18089 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18090 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18091 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18092 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18093 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18094 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:18095 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8080 reuseport backlog=65535;
        server_name _;

        # Cheap ingress-only probe. Backend health is handled passively by the
        # upstream failure counters and can be checked directly on localhost.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # API responses are never cached. Nginx fully buffers the request body
        # before assigning a backend so slow clients do not occupy the C++
        # server's blocking worker threads. Response buffering likewise releases
        # backend workers before slow clients finish downloading.
        location ~ ^/api(?:/|$) {
            proxy_pass http://cad_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-CAD-Session-Id $http_x_cad_session_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering on;
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_busy_buffers_size 64k;
            proxy_connect_timeout 1s;
            proxy_send_timeout 15s;
            proxy_read_timeout 180s;

            # A stateful request must not silently hop to a different process
            # after partial failure; the client can retry against the consistent
            # hash after Nginx marks a failed backend unavailable.
            proxy_next_upstream off;
        }

        # The built-in server reconstructs static responses from disk on each
        # request and marks everything no-store. Cache those immutable GET/HEAD
        # responses at the event-driven ingress instead of spending backend
        # workers and filesystem I/O on every browser asset request.
        location / {
            proxy_pass http://cad_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-CAD-Session-Id $http_x_cad_session_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering on;
            proxy_buffering on;
            proxy_connect_timeout 1s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;

            proxy_cache cad_static;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme|$request_method|$host|$request_uri";
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-CAD-Cache $upstream_cache_status always;
        }
    }
}
