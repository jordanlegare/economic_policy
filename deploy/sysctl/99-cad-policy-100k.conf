# Host-level socket admission tuning for the Nginx ingress. Apply with:
#   sudo sysctl --system
# after copying this file to /etc/sysctl.d/99-cad-policy-100k.conf.
fs.file-max = 2097152
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65536
net.ipv4.tcp_max_syn_backlog = 262144
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_syncookies = 1
