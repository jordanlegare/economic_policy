name: Delegation staging verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check delegation staging JavaScript
        run: node --check web/trade-incidence.js
      - name: Verify delegation sliders stage until explicit run
        run: node tests/delegation_staging_test.js
