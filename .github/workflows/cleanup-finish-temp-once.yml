name: Cleanup finish temp once
on:
  push:
    branches: [agent/finish-model-realism]
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-model-realism
      - name: Remove branch-only helpers and workflows
        run: |
          rm -f tools/fix_oecd_denominators_once.py
          rm -f .github/workflows/fix-oecd-denominators-once.yml
          rm -f .github/workflows/cleanup-finish-temp-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove final temporary branch tooling'
          git push origin HEAD:agent/finish-model-realism
