name: Plumbing hardening once

on:
  push:
    branches: [agent/plumbing-hardening]

permissions:
  contents: write

jobs:
  transform-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plumbing-hardening
          fetch-depth: 0
      - name: Prepare and apply transformer
        run: |
          sed -i "s/']}/]}/g; s/'],/],/g" tools/plumbing_hardening_once.py
          sed -i 's/^          : cad::apply_calibration(parse(body), engine.snapshot());$/            : cad::apply_calibration(parse(body), engine.snapshot());/' src/main.cpp
          python3 -m py_compile tools/plumbing_hardening_once.py
          python3 tools/plumbing_hardening_once.py
      - name: Browser syntax and controller contract
        run: |
          node --check web/app.js
          node --check web/evaluation-controller.js
          node --check web/diplomat.js
          node --check web/calibration.js
          node tests/evaluation_controller_test.js
          node tests/model_evidence_ui_test.js
          node tests/dashboard_panels_test.js
      - name: Release build and C++ tests
        env:
          CXXFLAGS: -Werror
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Commit transformed production tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden model plumbing end to end'
          git push origin HEAD:agent/plumbing-hardening
