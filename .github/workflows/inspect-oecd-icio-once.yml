name: Inspect OECD ICIO once

on:
  push:
    branches: [agent/bilateral-trade-realism]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect OECD download response
        run: |
          set -uxo pipefail
          url='https://webfs-sti.oecd.org/files/STI-PIE/ICIO/2025/2016-2022_SML.zip'
          curl -I -L "$url" || true
          curl --retry 2 -L -A 'Mozilla/5.0' -o /tmp/icio.bin "$url"
          wc -c /tmp/icio.bin
          file /tmp/icio.bin
          head -40 /tmp/icio.bin || true
