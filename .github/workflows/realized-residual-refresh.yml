name: Realized residual refresh

on:
  push:
    branches: [agent/v2-realized-residuals]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-realized-residuals
      - name: Apply durable realized-series parser fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build_realized_residuals.py')
          t=p.read_text()
          old="""def fred(raw):
    out={}
    for row in csv.DictReader(io.StringIO(raw.decode('utf-8-sig'))):
        vals=[v for k,v in row.items() if k!='DATE' and v not in (None,'','.')]
        if not vals:continue
        try:out[qdate(row['DATE'])]=float(vals[0])
        except ValueError:pass
    return out
"""
          new="""def fred(raw):
    out={}
    reader=csv.DictReader(io.StringIO(raw.decode('utf-8-sig')))
    for row in reader:
        date_key=next((k for k in row if k.lower() in {'date','observation_date'}),None)
        value_key=next((k for k in row if k!=date_key),None)
        if not date_key or not value_key or row.get(value_key) in (None,'','.'):continue
        try:out[qdate(row[date_key])]=float(row[value_key])
        except (ValueError,KeyError):pass
    return out
"""
          if t.count(old)!=1:raise SystemExit('FRED parser block not found')
          t=t.replace(old,new,1)
          t=t.replace('def ar1(series):','def ar1(series,name="unknown"):',1)
          t=t.replace("raise RuntimeError(f'insufficient realized observations: {len(obs)}')","raise RuntimeError(f'insufficient realized observations for {name}: {len(obs)}; range={min(series) if series else None}..{max(series) if series else None}')",1)
          t=t.replace('ar1(data[name])','ar1(data[name],name)',1)
          p.write_text(t)
          PY
      - name: Refresh realized quarterly residuals
        run: python3 tools/build_realized_residuals.py --refresh
      - name: Verify generated residual artifacts
        run: python3 tools/build_realized_residuals.py --verify
      - name: Freeze generated residual artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/build_realized_residuals.py data/calibration/realized_residual_estimates.csv data/calibration/realized_residual_covariance.csv data/calibration/realized_residual_manifest.csv data/calibration/empirical_structural_evidence.csv
          if git diff --cached --quiet; then
            echo 'No residual artifacts changed'
          else
            git commit -m 'Freeze realized residual calibration'
            git push origin HEAD:agent/v2-realized-residuals
          fi
