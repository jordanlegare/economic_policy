name: Apply tail registry once
on:
  push:
    branches: [agent/finish-model-realism]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Wire tail-regime structural parameters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-model-realism
      - run: python3 tools/apply_tail_registry_patch.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/structural_calibration.hpp include/robustness.hpp
          git commit -m 'Wire tail-regime structural parameters'
          git push origin HEAD:agent/finish-model-realism
