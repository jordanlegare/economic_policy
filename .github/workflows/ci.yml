name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/diplomat.js
          node --check web/negotiation-model.js
      - name: Verify diplomatic assets are wired
        run: |
          grep -q 'diplomat.css' src/main.cpp
          grep -q 'diplomat.js' src/main.cpp
          grep -q 'negotiation-model.css' src/main.cpp
          grep -q 'negotiation-model.js' src/main.cpp
          grep -q 'Diplomatic decision desk' web/diplomat.js
          grep -q 'Computational negotiation support' web/negotiation-model.js
          grep -q 'analyze_negotiation' src/main.cpp

  build-and-test:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure