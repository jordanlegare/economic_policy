name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/evaluation-controller.js
          node --check web/diplomat.js
          node --check web/negotiation-model.js
          node --check web/trade-diplomacy.js
          node --check web/calibration.js
          node --check web/robust-room.js
          node --check web/principal-briefing.js
      - name: Verify finite evaluation controller
        run: node tests/evaluation_controller_test.js
      - name: Check calibration tooling
        run: |
          python3 -m py_compile tools/refresh_calibration.py tools/estimate_trade_response.py
          python3 tests/estimate_trade_response_test.py
          test -s data/calibration/source_registry.csv
          test -s data/calibration/current.snapshot.csv
          grep -q 'statcan_trade_annual' data/calibration/source_registry.csv
          grep -q 'usitc_hts' data/calibration/source_registry.csv
          grep -q 'future-not-applied-as-of-snapshot' data/calibration/current.snapshot.csv
      - name: Verify briefing PDF generator
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          global.window = {};
          global.document = {readyState:'loading', addEventListener(){}, querySelector(){return null;}};
          global.localStorage = {getItem(){return null;}, setItem(){}};
          global.navigator = {};
          vm.runInThisContext(fs.readFileSync('web/trade-diplomacy.js','utf8'));
          if (!window.BriefingPdf?.buildPdf) throw new Error('BriefingPdf builder not exposed');
          const bytes = window.BriefingPdf.buildPdf([
            {type:'h1', text:'Canada-United States negotiation brief'},
            {type:'h2', text:'Decision'},
            {type:'p', text:'Open with the robust package and preserve the bridge option.'},
            {type:'bullet', text:'- Verify implementation before reciprocal relief.'}
          ]);
          const pdf = Buffer.from(bytes).toString('latin1');
          if (!pdf.startsWith('%PDF-1.4')) throw new Error('Missing PDF header');
          if (!pdf.includes('/Type /Catalog') || !pdf.includes('/Type /Page ')) throw new Error('Missing PDF objects');
          if (!pdf.includes('xref') || !pdf.includes('startxref') || !pdf.endsWith('%%EOF\n')) throw new Error('Invalid PDF trailer');
          if (bytes.length < 800) throw new Error('PDF output unexpectedly small');
          NODE
      - name: Verify principal briefing
        run: node tests/principal_briefing_test.js
      - name: Render principal briefing smoke PDF
        run: |
          command -v pdftoppm >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          mkdir -p artifacts/rendered
          pdfinfo artifacts/principal-briefing-smoke.pdf | tee artifacts/pdfinfo.txt
          pdftoppm -png -r 130 artifacts/principal-briefing-smoke.pdf artifacts/rendered/page
          test -s artifacts/rendered/page-1.png
      - uses: actions/upload-artifact@v4
        with:
          name: principal-briefing-smoke
          path: artifacts/
      - name: Verify diplomatic assets are wired
        run: |
          grep -q 'diplomat.css' src/main.cpp
          grep -q 'diplomat.js' src/main.cpp
          grep -q 'negotiation-model.css' src/main.cpp
          grep -q 'negotiation-model.js' src/main.cpp
          grep -q 'trade-diplomacy.css' src/main.cpp
          grep -q 'trade-diplomacy.js' src/main.cpp
          grep -q 'calibration.css' src/main.cpp
          grep -q 'calibration.js' src/main.cpp
          grep -q 'robust-room.css' src/main.cpp
          grep -q 'robust-room.js' src/main.cpp
          grep -q 'principal-briefing.css' src/main.cpp
          grep -q 'principal-briefing.js' src/main.cpp
          grep -q 'evaluation-controller.js' src/main.cpp
          grep -q 'comparisonOnly' src/main.cpp
          grep -q 'Diplomatic decision desk' web/diplomat.js
          grep -q 'Computational negotiation support' web/negotiation-model.js
          grep -q 'Canada–U.S. trade diplomacy operations' web/trade-diplomacy.js
          grep -q 'Data provenance & calibration' web/calibration.js
          grep -q 'Uncertainty & diplomat room' web/robust-room.js
          grep -q 'Principal Decision Brief' web/principal-briefing.js
          grep -q 'DECISION REQUIRED TODAY' web/principal-briefing.js
          grep -q 'EVIDENCE SOURCES' web/principal-briefing.js
          grep -q 'application/pdf' web/trade-diplomacy.js
          grep -q 'Save briefing PDF' web/trade-diplomacy.js
          grep -q 'analyze_negotiation' src/main.cpp
          grep -q 'analyze_robust_recommendations' src/main.cpp
          grep -q 'build_trade_diplomacy_platform' src/main.cpp
          grep -q 'CalibratedPolicyEngine' src/main.cpp
          grep -q '/api/calibration' src/main.cpp
          grep -q '/api/room' src/main.cpp

  build-and-test:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure
