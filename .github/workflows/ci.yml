name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/evaluation-controller.js
          node --check web/session.js
          node --check web/trade-incidence.js
          node --check web/diplomat.js
          node --check web/negotiation-model.js
          node --check web/trade-diplomacy.js
          node --check web/calibration.js
          node --check web/robust-room.js
          node --check web/principal-briefing.js
      - name: Verify finite evaluation controller
        run: |
          node tests/evaluation_controller_test.js
          node tests/model_evidence_ui_test.js
          node tests/dashboard_panels_test.js
      - name: Verify optimized Release build and active tests
        env:
          CXXFLAGS: -Werror
        run: |
          cmake -S . -B build-default
          grep -q '^CMAKE_BUILD_TYPE:STRING=Release$' build-default/CMakeCache.txt
          cmake --build build-default --parallel
          ctest --test-dir build-default --output-on-failure
      - name: Smoke test real initial evaluation
        run: |
          ./build-default/cad-policy-studio 18080 > /tmp/cad-policy-studio.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then break; fi
            sleep 0.25
          done
          start=$(date +%s)
          timeout 45 curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-CAD-Session-Id: ci-smoke' \
            -d '{}' \
            http://127.0.0.1:18080/api/evaluate > /tmp/initial-evaluate.json
          elapsed=$(( $(date +%s) - start ))
          echo "Release initial /api/evaluate completed in ${elapsed}s"
          grep -q '"scenarios":\[' /tmp/initial-evaluate.json
          grep -q '"robustness":{' /tmp/initial-evaluate.json
          grep -q '"secondStageMonteCarloDraws":5000' /tmp/initial-evaluate.json
          curl -fsS http://127.0.0.1:18080/trade-incidence.js | grep -q 'Tariff incidence'
          curl -fsS http://127.0.0.1:18080/session.js | grep -q 'X-CAD-Session-Id'
      - name: Check calibration tooling
        run: |
          python3 -m py_compile tools/refresh_calibration.py tools/estimate_trade_response.py tools/verify_trade_gate_certification.py tools/build_statcan_io_matrix.py tools/build_bea_io_matrix.py tools/verify_structural_promotions.py
          python3 tests/estimate_trade_response_test.py
          python3 tests/statcan_io_builder_test.py
          python3 tools/verify_structural_promotions.py
          python3 tools/verify_trade_gate_certification.py --verify
          test -s data/calibration/source_registry.csv
          test -s data/calibration/current.snapshot.csv
          test -s data/calibration/trade_gate_certification.csv
          test -s data/calibration/io_2024_model_mapping.csv
          test -s data/calibration/statcan_io_2024_matrix.csv
          test -s data/calibration/statcan_io_2024_provenance.json
          test -s include/generated/trade_io_2024.hpp
          test -s data/backtests/2018-section232-trade-validation.csv
          grep -q 'statcan_trade_annual' data/calibration/source_registry.csv
          grep -q 'boc_mpr_tariffs_2026_07' data/calibration/source_registry.csv
          grep -q 'carrere_grujovic_robert_nicoud_2020' data/calibration/source_registry.csv
          grep -q 'statcan_2018_tariff_export_study' data/calibration/source_registry.csv
          grep -q 'finance_canada_2018_countermeasures' data/calibration/source_registry.csv
          grep -q 'bea_input_output' data/calibration/source_registry.csv
          grep -q 'future-not-applied-as-of-2026-08-12' data/calibration/current.snapshot.csv
          grep -q '36-10-0001-01' data/calibration/statcan_io_2024_provenance.json
          grep -q '3c7422bce4c6ff2d5082d6ac1afb4f31610039b71ada9973126673f705f0fc22' data/calibration/statcan_io_2024_provenance.json
      - name: Verify briefing PDF generator
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          global.window = {};
          global.document = {readyState:'loading', addEventListener(){}, querySelector(){return null;}};
          global.localStorage = {getItem(){return null;}, setItem(){}};
          global.navigator = {};
          vm.runInThisContext(fs.readFileSync('web/trade-diplomacy.js','utf8'));
          if (!window.BriefingPdf?.buildPdf) throw new Error('BriefingPdf builder not exposed');
          const bytes = window.BriefingPdf.buildPdf([
            {type:'h1', text:'Canada-United States negotiation brief'},
            {type:'h2', text:'Decision'},
            {type:'p', text:'Open with the robust package and preserve the bridge option.'},
            {type:'bullet', text:'- Verify implementation before reciprocal relief.'}
          ]);
          const pdf = Buffer.from(bytes).toString('latin1');
          if (!pdf.startsWith('%PDF-1.4')) throw new Error('Missing PDF header');
          if (!pdf.includes('/Type /Catalog') || !pdf.includes('/Type /Page ')) throw new Error('Missing PDF objects');
          if (!pdf.includes('xref') || !pdf.includes('startxref') || !pdf.endsWith('%%EOF\n')) throw new Error('Invalid PDF trailer');
          if (bytes.length < 800) throw new Error('PDF output unexpectedly small');
          NODE
      - name: Verify principal briefing
        run: node tests/principal_briefing_test.js
      - name: Render principal briefing smoke PDF
        run: |
          command -v pdftoppm >/dev/null || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          mkdir -p artifacts/rendered
          pdfinfo artifacts/principal-briefing-smoke.pdf | tee artifacts/pdfinfo.txt
          pdftoppm -png -r 130 artifacts/principal-briefing-smoke.pdf artifacts/rendered/page
          test -s artifacts/rendered/page-1.png
      - uses: actions/upload-artifact@v4
        with:
          name: principal-briefing-smoke
          path: artifacts/
      - name: Verify operational assets are wired
        run: |
          grep -q 'diplomat.css' src/server.cpp
          grep -q 'diplomat.js' src/server.cpp
          grep -q 'negotiation-model.css' src/server.cpp
          grep -q 'negotiation-model.js' src/server.cpp
          grep -q 'trade-diplomacy.css' src/server.cpp
          grep -q 'trade-diplomacy.js' src/server.cpp
          grep -q 'trade-incidence.js' src/server.cpp
          grep -q 'calibration.css' src/server.cpp
          grep -q 'calibration.js' src/server.cpp
          grep -q 'robust-room.css' src/server.cpp
          grep -q 'robust-room.js' src/server.cpp
          grep -q 'principal-briefing.css' src/server.cpp
          grep -q 'principal-briefing.js' src/server.cpp
          grep -q 'evaluation-controller.js' src/server.cpp
          grep -q 'session.js' src/server.cpp
          grep -q 'comparisonOnly' src/server.cpp
          grep -q 'analyze_negotiation' src/server.cpp
          grep -q 'analyze_robust_recommendations' src/server.cpp
          grep -q 'build_trade_diplomacy_platform' src/server.cpp
          grep -q 'CalibratedPolicyEngine' src/server.cpp
          grep -q '/api/calibration' src/server.cpp
          grep -q '/api/room' src/server.cpp
          grep -q '/api/health' src/server.cpp
          grep -q '/api/v2/robustness-batch' src/server.cpp
          grep -q 'X-CAD-Session-Id' web/session.js
          grep -q 'Authorization' web/session.js
          grep -q 'Diplomatic decision desk' web/diplomat.js
          grep -q 'Computational negotiation support' web/negotiation-model.js
          grep -q 'Canada–U.S. trade diplomacy operations' web/trade-diplomacy.js
          grep -q 'Data provenance & calibration' web/calibration.js
          grep -q 'Model evidence V2' web/calibration.js
          grep -q '/api/v2/backtests' web/calibration.js
          grep -q '/api/v2/welfare' web/calibration.js
          grep -q '/api/v2/robustness' web/calibration.js
          grep -q 'Uncertainty & diplomat room' web/robust-room.js
          grep -q 'Principal Decision Brief' web/principal-briefing.js
          grep -q 'DECISION REQUIRED TODAY' web/principal-briefing.js
          grep -q 'EVIDENCE SOURCES' web/principal-briefing.js
          grep -q 'application/pdf' web/trade-diplomacy.js
          grep -q 'Save briefing PDF' web/trade-diplomacy.js

  build-and-test:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure
