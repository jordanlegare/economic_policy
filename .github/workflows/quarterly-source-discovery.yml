name: Quarterly empirical promotion

on:
  push:
    branches: [agent/v2-quarterly-estimation]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-quarterly-estimation
      - name: Apply quarterly promotion and parser guards
        run: python3 tools/apply_quarterly_promotion.py
      - name: Align structural registry integrity assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/calibration_test.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'assert(registry.registry_id == "v2-structural-2026-08-12");'
          new = 'assert(registry.registry_id == "v2-structural-quarterly-2026-08-12");'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one structural registry assertion')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify frozen quarterly calibration
        run: python3 tools/refresh_sep_calibration.py --verify
      - name: Build and test promoted model
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Freeze promoted empirical calibration
        run: |
          rm -f tools/apply_quarterly_promotion.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No promoted calibration changes to commit'
          else
            git commit -m 'Promote quarterly empirical calibration'
            git push origin HEAD:agent/v2-quarterly-estimation
          fi
