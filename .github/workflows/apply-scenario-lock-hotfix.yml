name: Scenario lock patch

on:
  push:
    branches:
      - agent/lock-delegation-scenario

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lock-delegation-scenario
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_scenario_lock_hotfix.py
      - name: JavaScript checks
        run: |
          node --check web/trade-incidence.js
          node --check web/negotiation-model.js
          node tests/delegation_staging_test.js
          node tests/evaluation_controller_test.js
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit patch
        shell: bash
        run: |
          git rm .github/workflows/apply-scenario-lock-hotfix.yml tools/apply_scenario_lock_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/policy_engine.hpp include/server_contracts.hpp include/negotiation_support.hpp src/policy_engine.cpp web/trade-incidence.js web/negotiation-model.js tests/policy_engine_test.cpp tests/delegation_staging_test.js tests/negotiation_support_test.cpp
          git commit -m "Lock delegation scenario inputs"
          git push origin HEAD:agent/lock-delegation-scenario
