name: Quarterly calibration integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-quarterly-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen quarterly empirical calibration
        run: python3 tools/refresh_sep_calibration.py --verify
      - name: Verify realized-data residual frontier
        run: python3 tools/estimate_realized_residuals.py --verify
      - name: Verify observed-data trade calibration certificate
        run: python3 tools/verify_trade_gate_certification.py --verify
