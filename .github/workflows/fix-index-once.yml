name: Fix index once
on:
  push:
    branches: [agent/bilateral-trade-realism]
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.head_commit.message != 'Normalize trade-incidence script include'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bilateral-trade-realism
      - run: python3 tools/fix_index_once.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git commit -m 'Normalize trade-incidence script include'
          git push origin HEAD:agent/bilateral-trade-realism
