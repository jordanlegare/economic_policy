name: Resolve PR 71 against main

on:
  push:
    branches: [agent/live-delegation-sector-metrics]

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main and resolve overlapping UI work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --no-tags
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            python3 <<'PY'
          import subprocess
          from pathlib import Path

          def stage(stage, path):
              return subprocess.check_output(['git','show',f':{stage}:{path}'], text=True)

          controller_path = 'web/evaluation-controller.js'
          ours = stage(2, controller_path)
          main = stage(3, controller_path)

          profile_start = ours.index('  const clampValue =')
          profile_end = ours.index('  function displayedCoverage()', profile_start)
          profile_block = ours[profile_start:profile_end]

          metrics_start = ours.index('  function economyContext()')
          metrics_end = ours.index('  function sectorSearchSummary(rec)', metrics_start)
          metrics_block = ours[metrics_start:metrics_end]

          merged = main
          merged = merged.replace(
              '  let initialCalibrationApplied = false;\n',
              "  let initialCalibrationApplied = false;\n  let sectorPolicyCache = {result:null, scenarioId:'', terms:null};\n",
              1)
          merged = merged.replace('  function displayedCoverage() {', profile_block + '  function displayedCoverage() {', 1)
          merged = merged.replace('  function sectorSearchSummary(rec) {', metrics_block + '  function sectorSearchSummary(rec) {', 1)
          merged = merged.replace('      result = evaluated;\n', "      result = evaluated;\n      sectorPolicyCache = {result:null, scenarioId:'', terms:null};\n", 1)
          merged = merged.replace(
              '  window.EvaluationController = {',
              '  window.SectorResponseModel = {\n    coverageLevels,\n    sectorUtility,\n    policyTermsForScenario,\n    sectorMetrics\n  };\n\n  window.EvaluationController = {',
              1)
          merged = merged.replace(
              '    state() {',
              '    sectorMetrics,\n    state() {',
              1)
          Path(controller_path).write_text(merged)
          PY
          fi

          git add web/evaluation-controller.js tests/evaluation_controller_test.js web/app.js
          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "Unresolved paths remain:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

          node --check web/evaluation-controller.js
          node --check web/app.js
          node --check tests/evaluation_controller_test.js
          node tests/evaluation_controller_test.js

          git rm -f .github/workflows/resolve-pr71.yml
          git add -A
          git commit -m 'Resolve PR #71 with current main'
          git push origin HEAD:agent/live-delegation-sector-metrics
