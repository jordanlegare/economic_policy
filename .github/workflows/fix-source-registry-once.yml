name: Fix source registry once

on:
  push:
    branches: [agent/bilateral-trade-realism]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Normalize source registry schema rows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bilateral-trade-realism
      - run: python3 tools/fix_source_registry_rows.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calibration/source_registry.csv
          git commit -m 'Normalize source registry schema rows'
          git push origin HEAD:agent/bilateral-trade-realism
