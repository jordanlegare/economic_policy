name: Negotiation frontier UI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontier-ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check negotiation UI syntax
        run: node --check web/negotiation-model.js
      - name: Verify nine unique frontier packages
        run: node tests/negotiation_frontier_ui_test.js
