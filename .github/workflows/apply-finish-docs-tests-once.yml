name: Apply finish docs tests once

on:
  push:
    branches: [agent/finish-model-realism]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply final docs and test wiring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-model-realism
          fetch-depth: 0
      - run: python3 tools/apply_finish_docs_tests_patch.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md docs/MODEL_ROBUSTNESS_V2.md data/calibration/source_registry.csv
          git commit -m 'Apply final docs and test wiring'
          git push origin HEAD:agent/finish-model-realism
