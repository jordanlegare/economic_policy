name: Branch policy refactor

on:
  push:
    branches:
      - agent/bilateral-trade-realism

permissions:
  contents: write

jobs:
  apply-exact-refactor:
    if: github.event.head_commit.message != 'Apply exact policy-engine refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bilateral-trade-realism
          fetch-depth: 0
      - name: Apply exact audited substitutions
        run: python3 tools/branch_policy_refactor.py
      - name: Commit resulting large-file edits
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/policy_engine.cpp web/index.html CMakeLists.txt
          git commit -m 'Apply exact policy-engine refactor'
          git push origin HEAD:agent/bilateral-trade-realism
