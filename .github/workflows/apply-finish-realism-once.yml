name: Apply finish realism once

on:
  push:
    branches: [agent/finish-model-realism]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply final policy realism patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-model-realism
          fetch-depth: 0
      - run: python3 tools/apply_finish_realism_patch.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/policy_engine.cpp
          git commit -m 'Apply final policy realism patch'
          git push origin HEAD:agent/finish-model-realism
