name: Resolve PR 71 latest main

on:
  push:
    branches: [agent/live-delegation-sector-metrics]

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and preserve both app.js changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --no-tags
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            python3 <<'PY'
          import subprocess
          from pathlib import Path

          path = 'web/app.js'
          ours = subprocess.check_output(['git','show',f':2:{path}'], text=True)
          main = subprocess.check_output(['git','show',f':3:{path}'], text=True)

          # Start from PR #71's live-metrics app and layer in main's package-title feature.
          marker = "const positions={canada:Array(20).fill(100),us:Array(20).fill(100)};\n"
          start = main.index("const compactNumber=value=>")
          end = main.index("function updateTariff()", start)
          title_block = main[start:end]
          merged = ours.replace(marker, marker + title_block, 1)
          merged = merged.replace("function render(){const best=result.scenarios[0]", "function render(){applyMeaningfulPackageNames(result);const best=result.scenarios[0]", 1)
          merged = merged.replace("${s.id==='custom'?'AUTONOMOUS SEARCH · ':''}", "${s.id==='custom'||String(s.id).startsWith('custom-')?'AUTONOMOUS SEARCH · ':''}", 1)
          Path(path).write_text(merged)
          PY
          fi

          git add web/app.js
          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "Unresolved paths remain:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

          node --check web/app.js
          node --check web/evaluation-controller.js
          node --check tests/evaluation_controller_test.js
          node tests/evaluation_controller_test.js

          git rm -f .github/workflows/resolve-pr71-latest-main.yml
          git add -A
          git commit -m 'Merge latest main into PR #71'
          git push origin HEAD:agent/live-delegation-sector-metrics
